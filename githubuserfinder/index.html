<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Finder</title>
    <!-- Bootstrap cdn link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container my-5 text-center">
        <h1 class="text-primary">GitHub Profile Search</h1>

        <div class="row justify-content-center my-4">
            <div class="col-lg-6">
                <input id="githubUsername" type="text" placeholder="Enter GitHub username" class="form-control mb-3">
                <button onclick="fetchUserData()" class="btn btn-primary w-100">Search</button>
            </div>
        </div>

        <!-- Profile Display Area -->
        <div id="profileDetails" class="my-4">

        </div>
    </div>
</body>
<script>
    function fetchUserData() {
        const usernameInput = document.getElementById("githubUsername").value
        const profileDetails = document.getElementById("profileDetails")

        if (!usernameInput) {
            alert("Please enter a username")
            return
        }

        // 1. Create XMLHttpRequest object
        const xhr = new XMLHttpRequest()

        // 2. Configure request
        xhr.open("GET", `https://api.github.com/users/${usernameInput}`)

        // 3. Handle response
        xhr.onload = function () {
            if (xhr.status == 200) {
                const userData = JSON.parse(xhr.responseText)
                console.log(userData)

                profileDetails.innerHTML = `
          <div class="card mx-auto shadow-sm p-3" style="max-width: 400px;">
            <img src="${userData.avatar_url}" width="200" height="200" class="rounded-circle mx-auto my-3" style="object-fit: cover">
            <h3>${userData.name || "No Name Provided"}</h3>
            <p class="text-muted">${userData.bio || "No Bio Available"}</p>
            <ul class="list-group list-group-flush text-start">
              <li class="list-group-item"><strong>Followers:</strong> ${userData.followers}</li>
              <li class="list-group-item"><strong>Public Repositories:</strong> ${userData.public_repos}</li>
            </ul>
          </div>
        `
            } else if (xhr.status == 404) {
                profileDetails.innerHTML = `<h3 class="text-danger">User Not Found</h3>`
            } else {
                profileDetails.innerHTML = `<h3 class="text-danger">Error fetching user data</h3>`
            }
        }

        xhr.onerror = function () {
            profileDetails.innerHTML = `<h3 class="text-danger">Network Error</h3>`
        }
        xhr.send()
    }
</script>

</html>
