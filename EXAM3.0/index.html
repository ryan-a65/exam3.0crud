//task tracker app
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container my-5 mt-5">
        <h1 class="text-center text-primary">Task Tracker CRUD</h1>
        <form id="taskForm">
            <div class="row my-5">
                <input type="text" id="editStatus" hidden>
                <div class="col-lg-4">
                    <input id="taskTitle" type="text" placeholder="Task Title" class="form-control">
                </div>
                <div class="col-lg-4">
                    <input id="taskDescription" type="text" placeholder="Task Description" class="form-control">
                </div>
                <div class="col-lg-4">
                    <button type="submit" class="btn btn-success w-100">Save Task</button>
                </div>
            </div>
        </form>

        <table class="my-5 table table-bordered table-hover">
            <thead class="table-dark text-light my-5 text-center">
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">

            </tbody>
        </table>
    </div>
</body>
<script src="./main.js"></script>

</html>
